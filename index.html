<body>
  <main class="intro" id="intro">
    <div class="intro__content">

      <!-- =====================================================
           LOGO
           ===================================================== -->
      <img
        class="intro__logo"
        id="introLogo"
        src="/assets/vb-logo.png"
        alt="Václav Buchtelík"
        width="1200"
        height="1200"
        decoding="async"
        fetchpriority="high"
        draggable="false"
      >

      <!-- =====================================================
           ENTER GATE
           ===================================================== -->
      <div class="intro__gate" id="introGate">
        <button
          class="intro__enter"
          id="introEnter"
          type="button"
          aria-label="Enter the Václav Buchtelík website"
        >
          ENTER
        </button>

        <span
          class="intro__arrow"
          id="introArrow"
          aria-hidden="true"
        >
          <img
            class="intro__arrow-icon"
            src="/assets/icons/arrow-up.svg"
            alt=""
            width="24"
            height="24"
            decoding="async"
            draggable="false"
          >
        </span>
      </div>

      <!-- =====================================================
           SOUND CONTROL
           ===================================================== -->
      <button
        class="intro__sound"
        id="introSound"
        type="button"
        aria-label="Turn sound on"
        aria-pressed="false"
      >
        <img
          class="intro__sound-icon"
          id="introSoundIcon"
          src="/assets/icons/mute.svg"
          alt=""
          width="24"
          height="24"
          decoding="async"
          draggable="false"
        >
      </button>

    </div>
  </main>

  <noscript>
    <style>
      .intro__logo,
      .intro__gate,
      .intro__enter,
      .intro__arrow,
      .intro__sound {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translate3d(0, 0, 0) !important;
      }
    </style>
  </noscript>

  <script src="/assets/js/main.js" defer></script>
